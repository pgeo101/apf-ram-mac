name: macOS

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run tests
        run: sh test.sh
      - name: Build Apple Silicon app
        run: sh build.sh
      - name: Verify app signature
        run: codesign --verify --strict --verbose=2 "APF RAM.app"
